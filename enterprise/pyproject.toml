[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-enterprise"
version = "1.0.0"
description = "Context-aware forensic incident investigation and policy-gated remediation"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{name = "OpsPilot Engineering"}]
dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pysnmp>=7.1.28,<8",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "coverage[toml]>=7.10,<8",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
opspilot-api = "opspilot_enterprise.cli:api_main"
opspilot-worker = "opspilot_enterprise.cli:worker_main"
opspilot-router-poller = "opspilot_enterprise.cli:router_poller_main"
opspilot-remediate = "opspilot_enterprise.cli:remediate_main"
opspilot-import-legacy-ledger = "opspilot_enterprise.cli:import_legacy_main"
opspilot-snmp-poller = "opspilot_enterprise.cli:snmp_poller_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["opspilot_enterprise"]
